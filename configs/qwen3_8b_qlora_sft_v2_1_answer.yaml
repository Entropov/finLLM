# Qwen3-8B SFT v2.1 answer adapter. Uses only verified final-answer samples.
model_name_or_path: Qwen/Qwen3-8B
adapter_name_or_path: saves/qwen3-8b/lora/sft/checkpoint-4000
trust_remote_code: true

quantization_bit: 4
quantization_method: bitsandbytes

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

dataset: fin_agentic_sft_v2_1_answer_train
eval_dataset: fin_agentic_sft_v2_1_answer_eval
dataset_dir: data
template: qwen3
enable_thinking: true
cutoff_len: 8192
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

output_dir: saves/qwen3-8b/lora/sft-v2.1-answer
logging_steps: 5
save_steps: 20
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: tensorboard

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.10
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 42

per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 20
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
