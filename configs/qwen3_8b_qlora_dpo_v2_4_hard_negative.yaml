# Hard-negative preference refinement after Dev-Audit-selected SFT v2.4.
model_name_or_path: Qwen/Qwen3-8B
adapter_name_or_path: saves/qwen3-8b/lora/sft-v2.4-selected
trust_remote_code: true

quantization_bit: 4
quantization_method: bitsandbytes

stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

pref_beta: 0.05
pref_loss: sigmoid
pref_ftx: 0.2

dataset: fin_agentic_sft_v2_4_hard_negative
dataset_dir: data
template: qwen3
enable_thinking: false
cutoff_len: 4096
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

output_dir: saves/qwen3-8b/lora/sft-v2.4-hardneg
logging_steps: 5
save_steps: 20
save_total_limit: 20
plot_loss: true
overwrite_output_dir: true
report_to: tensorboard

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-7
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.08
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 45

eval_strategy: "no"
load_best_model_at_end: false
