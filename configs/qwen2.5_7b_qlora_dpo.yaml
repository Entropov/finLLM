# ============================================================
# Fin-Instruct QLoRA DPO 训练配置
# 基于 SFT checkpoint 进行 DPO 偏好对齐
# 硬件目标: 单卡 RTX 5090 32GB
# 框架: LLaMA-Factory
# ============================================================
# 使用方式:
#   llamafactory-cli train configs/qwen2.5_7b_qlora_dpo.yaml
# ============================================================

# ==================== 模型配置 ====================
model_name_or_path: Qwen/Qwen2.5-7B-Instruct    # 基座模型路径
trust_remote_code: true

# 加载 SFT 阶段训练好的 LoRA 权重作为 DPO 起点
# 注意: 必须先完成 SFT 阶段训练，checkpoint 路径与 sft.yaml 的 output_dir 一致
adapter_name_or_path: saves/qwen2.5-7b/lora/sft  # SFT LoRA checkpoint

# ==================== QLoRA 量化配置 ====================
quantization_bit: 4                # 4-bit NF4 量化
quantization_method: bitsandbytes

# ==================== DPO 训练方法 ====================
stage: dpo                         # DPO 偏好优化阶段
do_train: true
finetuning_type: lora              # 继续在 SFT LoRA 基础上微调
lora_rank: 16                      # 保持与 SFT 阶段相同的 rank
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

# DPO 核心超参数
pref_beta: 0.1          # KL 散度约束强度 (beta)
                         # 越小 = 越敢于偏离参考策略 = 更激进的对齐
                         # 越大 = 越保守 = 更接近 SFT 基线
                         # 金融场景建议: 0.05~0.15
pref_loss: sigmoid       # DPO 变体: sigmoid (标准DPO) | orpo | simpo

# ==================== 数据集配置 ====================
dataset: fin_preference_train      # 偏好训练数据（需要先生成）
dataset_dir: data
template: qwen                     # Qwen2.5 ChatML 模板
cutoff_len: 2048                   # DPO 需要同时编码 chosen/rejected，长度减半
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2

# ==================== 输出配置 ====================
output_dir: saves/qwen2.5-7b/lora/dpo    # DPO 输出目录
logging_steps: 10
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: tensorboard

# ==================== 训练超参数 ====================
# DPO 通常使用比 SFT 更小的 batch size（因为需要同时处理 chosen+rejected）
per_device_train_batch_size: 1     # DPO 每 GPU batch size（RTX 5090 32GB 下）
gradient_accumulation_steps: 16   # 有效 batch_size = 1 * 16 = 16
learning_rate: 5.0e-6              # DPO 阶段学习率宜小（防止偏移过大）
                                   # SFT 用 1e-4，DPO 建议 5e-7 ~ 1e-5
num_train_epochs: 3.0              # DPO 通常 1~3 epoch 即可
lr_scheduler_type: cosine
warmup_ratio: 0.05                 # DPO 短 warmup（5%）
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
ddp_timeout: 180000000
seed: 42

# ==================== 验证配置 ====================
val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
load_best_model_at_end: true

# ==================== 可选加速 ====================
# flash_attn: fa2                  # FlashAttention-2（需安装）
# enable_liger_kernel: true        # Liger Kernel 加速（实验性）
