# Qwen3-8B SFT v2.4: no-think, sample-balanced, audit-token-weighted repair.
model_name_or_path: Qwen/Qwen3-8B
adapter_name_or_path: saves/qwen3-8b/lora/sft-v2.3-answer
trust_remote_code: true

quantization_bit: 4
quantization_method: bitsandbytes

stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

use_audit_weighted_loss: true
audit_numeric_weight: 3.0
audit_citation_weight: 3.0
audit_keyphrase_weight: 2.0
audit_eos_weight: 2.0

dataset: fin_agentic_sft_v2_4_answer_train
eval_dataset: fin_agentic_sft_v2_4_answer_eval
dataset_dir: data
template: qwen3
enable_thinking: false
cutoff_len: 4096
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

output_dir: saves/qwen3-8b/lora/sft-v2.4-answer
logging_steps: 5
save_steps: 20
save_total_limit: 20
plot_loss: true
overwrite_output_dir: true
report_to: tensorboard

per_device_train_batch_size: 1
gradient_accumulation_steps: 16
average_tokens_across_devices: false
learning_rate: 2.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.08
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 44

per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 20
load_best_model_at_end: false
