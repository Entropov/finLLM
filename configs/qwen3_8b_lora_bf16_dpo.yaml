# ============================================================
# Fin-Instruct LoRA BF16 DPO 训练配置（不使用量化）
# 基于 Qwen3-8B BF16 SFT adapter 进行 DPO 偏好对齐
# ============================================================
# 使用方式:
#   llamafactory-cli train configs/qwen3_8b_lora_bf16_dpo.yaml
# ============================================================

# ==================== 模型配置 ====================
model_name_or_path: Qwen/Qwen3-8B
trust_remote_code: true

adapter_name_or_path: saves/qwen3-8b/lora-bf16/sft

# 注意: 本配置不设置 quantization_bit/quantization_method。

# ==================== DPO 训练方法 ====================
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

pref_beta: 0.1
pref_loss: sigmoid

# ==================== 数据集配置 ====================
dataset: fin_preference_train
dataset_dir: data
template: qwen3_nothink
cutoff_len: 2048
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 8
dataloader_num_workers: 2

# ==================== 输出配置 ====================
output_dir: saves/qwen3-8b/lora-bf16/dpo
logging_steps: 10
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
report_to: tensorboard

# ==================== 训练超参数 ====================
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 5.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
ddp_timeout: 180000000
seed: 42

# ==================== 验证配置 ====================
val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 200
load_best_model_at_end: true

# ==================== 可选加速 ====================
# flash_attn: fa2
# enable_liger_kernel: true
