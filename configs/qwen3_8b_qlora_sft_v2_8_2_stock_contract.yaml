# Qwen3-8B v2.8.2: one-epoch stock contract repair, preserving core-task balance.
model_name_or_path: Qwen/Qwen3-8B
adapter_name_or_path: saves/qwen3-8b/lora/sft-v2.7-core-selected
trust_remote_code: true
quantization_bit: 4
quantization_method: bitsandbytes
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all
use_audit_weighted_loss: true
audit_numeric_weight: 4.0
audit_citation_weight: 5.0
audit_keyphrase_weight: 5.0
audit_eos_weight: 14.0
dataset: fin_agentic_sft_v2_8_2_core_answer_train
eval_dataset: fin_agentic_sft_v2_8_2_core_answer_eval
dataset_dir: data
template: qwen3
enable_thinking: false
cutoff_len: 3072
max_samples: 100000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4
output_dir: saves/qwen3-8b/lora/sft-v2.8.2-stock-contract-answer
logging_steps: 5
save_steps: 10
save_total_limit: 10
plot_loss: true
overwrite_output_dir: true
report_to: tensorboard
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
average_tokens_across_devices: false
learning_rate: 1.5e-6
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
seed: 59
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 10
load_best_model_at_end: false
